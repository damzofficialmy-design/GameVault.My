<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameVault.MY 🇲🇾 - Official Admin</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; margin: 0; padding: 20px; }
  .container { max-width: 500px; margin: auto; }
  .header { text-align: center; padding: 20px 0 10px 0; }
  .header h1 { margin: 0; }
  .header p { color: #25D366; font-weight: bold; font-size: 12px; }
  .card { background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 16px; padding: 14px; margin: 12px 0; display: flex; align-items: center; justify-content: space-between; }
  .left { display: flex; align-items: center; }
  .dp { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; margin-right: 12px; border: 2px solid #25D366; background: #333; }
  .name { font-weight: 800; font-size: 14px; }
  .role { font-size: 11px; color: #888; margin-top: 2px; }
  .badge { font-size: 9px; background: #25D366; color: #000; padding: 2px 6px; border-radius: 10px; margin-left: 5px; font-weight: 900; }
  .btn { background: #fff; color: #000; padding: 9px 18px; border-radius: 50px; text-decoration: none; font-weight: 800; font-size: 11px; }
  .btn-owner { background: #25D366; }
  .edit-hint { background: #111; border: 1px dashed #333; padding: 15px; border-radius: 10px; font-size: 11px; color: #777; margin-top: 25px; text-align: center; }
  .group a { display: block; background: #25D366; color: #000; margin: 10px 0; padding: 14px; border-radius: 12px; text-align: center; text-decoration: none; font-weight: 900; }
  .group a.sec { background: #1e1e1e; color: #fff; border: 1px solid #333; }
</style>
</head>
<body>
<div class="container">
  <div class="header">

    <a href="https://whatsapp.com/channel/0029VbDCZm63LdQaM7rBfz1Y" class="sec">📢 JOIN CHANNEL DAMZSTORE.MY</a>
  </div>

  <div class="edit-hint">
    💡 CARA TUKAR GAMBAR & NAMA:<br>
    Edit bahagian bawah code (const admins) je. Tukar link gambar atau upload gambar baru dalam repo dan letak nama file.
  </div>
</div>

<script>
// ==========================================
// EDIT KAT SINI SAHAJA UNTUK TUKAR DP / NAMA / LINK
// ==========================================
const admins = [
  {
    nama: "Damz Official",

    gambar: "https://i.pravatar.cc/150?img=68", // <-- TUKAR LINK GAMBAR DP KAT SINI
    wa: "60123456789" // <-- TUKAR NO WHATSAPP TANPA +

    badge: "ONLINE",
    gambar: "https://i.pravatar.cc/150?img=12",
    wa: "60123456789"
  },
  {
    nama: "Admin Along",
    jawatan: "Admin Jualan Malam",
    badge: "ONLINE",
    gambar: "https://i.pravatar.cc/150?img=33",
    wa: "60123456789"
  },
  {
    nama: "Admin Mira",
    jawatan: "Admin Support & Refund",
    badge: "ONLINE",
    gambar: "https://i.pravatar.cc/150?img=5",
    wa: "60123456789"
  },
  {
    nama: "Admin Eka",

const list = document.getElementById('adminList');
admins.forEach(a => {
  const isOwner = a.badge === 'OWNER';
  list.innerHTML += `
    <div class="card" ${isOwner ? 'style="border-color:#25D366"' : ''}>
      <div class="left">
        <img class="dp" src="${a.gambar}" onerror="this.src='https://via.placeholder.com/100'">

          <div class="name">${a.nama} <span class="badge">${a.badge}</span></div>

      </div>
      <a class="btn ${isOwner ? 'btn-owner' : ''}" href="https://wa.me/${a.wa}">CHAT</a>

  `;
});
</script>
</body>
</html>
